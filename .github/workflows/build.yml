name: Build Steam Emulator Setup

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "Steam Emulator Setup" `
            --icon="app_icon.ico" `
            --add-data "app_icon.ico;." `
            main.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release"

          Copy-Item `
            "dist\Steam Emulator Setup.exe" `
            "release\Steam Emulator Setup.exe"

          if (Test-Path "01_STEP") {
              Copy-Item `
                "01_STEP" `
                "release\01_STEP" `
                -Recurse
          }

          if (Test-Path "02_STEP") {
              Copy-Item `
                "02_STEP" `
                "release\02_STEP" `
                -Recurse
          }

          if (Test-Path "03_STEP") {
              Copy-Item `
                "03_STEP" `
                "release\03_STEP" `
                -Recurse
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "Steam-Emulator-Setup-Windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Emulator-Setup-Windows-x64
          path: Steam-Emulator-Setup-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Steam Emulator Setup ${{ github.ref_name }}
          body: |
            ## Steam Emulator Setup ${{ github.ref_name }}

            Windows x64 release.

            Download the ZIP below and extract it before running the application.
          files: |
            Steam-Emulator-Setup-Windows-x64.zip
          generate_release_notes: true
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
